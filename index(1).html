<style>

.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

.word{display:flex;font-size:60px;font-weight:800}
.word span{display:inline-block;color:#ffc2dd;opacity:0;animation:spl 1s cubic-bezier(.2,.9,.3,1.2) forwards,spread .6s 1.4s ease-in-out forwards}
.word span:nth-child(1){--x:-140px;animation-delay:.1s,1.4s}.word span:nth-child(2){--x:-50px;color:#b9f6ca;animation-delay:.25s,1.4s}
.word span:nth-child(3){--x:50px;animation-delay:.4s,1.4s}.word span:nth-child(4){--x:140px;color:#b9f6ca;animation-delay:.55s,1.4s}.word span:nth-child(5){--x:200px;animation-delay:.7s,1.4s}
@keyframes spl{from{opacity:0;transform:translate(var(--x),-70px) scale(.2) rotate(-40deg);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spread{to{margin:0 5px}}#splash .tag{margin-top:12px;font-size:17px;color:#ffe3ef;opacity:0;animation:fade .6s 1.5s forwards}
#splash .pb{width:170px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;margin-top:26px;overflow:hidden}#splash .pb i{display:block;height:100%;background:#fff;animation:fill 2s ease-in-out forwards}@keyframes fill{from{width:0}to{width:100%}}
#splash .ok{margin-top:18px;opacity:0;animation:fade .5s 1.7s forwards}@keyframes fade{to{opacity:1}}

<script>
const $=s=>document.querySelector(s);
let chats=[],cur=null,view=[],limit=400,urls={},sel=new Set(),lp=false,lt=0,mode="list",ptab="media",meSet=new Set(),vi=[],vx=0,tx0=0,buf="";
const LK="ruhi:pin",DF={};
/* storage */
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open("chatvault",1);r.onupgradeneeded=()=>{r.result.createObjectStore("chats",{keyPath:"id"});r.result.createObjectStore("media")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function op(store,mode,fn){const db=await DB();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}
async function load(){try{chats=(await op("chats","readonly",s=>s.getAll())).sort((a,b)=>b.added-a.added)}catch(e){chats=[]}}
const save=c=>op("chats","readwrite",s=>s.put(c));
const MIME={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",mp4:"video/mp4",mov:"video/quicktime","3gp":"video/3gpp",webm:"video/webm",opus:"audio/ogg; codecs=opus",ogg:"audio/ogg",mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav"};
async function mUrl(k){if(!urls[k]){const b=await op("media","readonly",s=>s.get(k));if(b){const x=(k.split(".").pop()||"").toLowerCase();urls[k]=URL.createObjectURL(MIME[x]?new Blob([b],{type:MIME[x]}):b)}}return urls[k]}
/* dialogs */
function dlg(msg,btns){return new Promise(r=>{const p=$("#panel");p.innerHTML=`<p style="margin:0 0 14px;word-break:break-word">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"></div>`;const row=p.lastChild;btns.forEach(([l,fn,cls])=>{const b=document.createElement("button");b.className="opt "+(cls||"");b.style.cssText="display:inline-block;width:auto";b.textContent=l;b.onclick=()=>{$("#sheet").classList.remove("open");if(fn)fn();r(l)};row.appendChild(b)});$("#sheet").classList.add("open")})}
const ask=(msg,ok)=>dlg(msg,ok?[["Cancel"],[ok,null,"red"]]:[["OK"]]).then(l=>l===ok);
function inp(title,val,num){return new Promise(r=>{const p=$("#panel");p.innerHTML=`<h3 style="margin:0 0 8px">${esc(title)}</h3><input id="pin1" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="opt" style="display:inline-block;width:auto" id="c1">Cancel</button><button class="opt" style="display:inline-block;width:auto;background:#25d366;color:#fff;border:0" id="o1">Save</button></div>`;const i=$("#pin1");i.value=val||"";if(num){i.type="password";i.inputMode="numeric"}$("#sheet").classList.add("open");i.focus();$("#c1").onclick=()=>{$("#sheet").classList.remove("open");r(null)};$("#o1").onclick=()=>{$("#sheet").classList.remove("open");r(i.value.trim())}})}
function openLink(u){dlg(u,[["Close"],["Copy",()=>{try{navigator.clipboard.writeText(u)}catch(e){}}],["Open",()=>{const w=window.open(u,"_blank");if(w)w.opener=null;else dlg("The link couldn’t open here. Use Copy and paste it in your browser.",[["OK"]])},"red"]])}
/* parsing */
const RE=/^\[?(\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}),?\s+(\d{1,2}[:.]\d{2}(?::\d{2})?(?:\s?[AaPp]\.?[Mm]\.?)?)\]?\s*(?:[-–]\s*)?([\s\S]*)$/;
function parse(text){const out=[];for(const raw of text.split(/\r?\n/)){const line=raw.replace(/[\u200e\u200f\u202a-\u202e]/g,"");const m=line.match(RE);
 if(m){const rest=m[3];let s="",b=rest;const i=rest.indexOf(": ");if(i>0&&i<60){s=rest.slice(0,i);b=rest.slice(i+2)}out.push({d:m[1],t:m[2].replace(/\s+/g," "),s,b})}else if(out.length)out[out.length-1].b+="\n"+line}return out}
function fileOf(b){let m=b.match(/<attached:\s*(.+?)>/);if(m)return m[1].trim();m=b.match(/^(.+?\.\w{2,5})\s\(file attached\)/);return m?m[1].trim():""}
function dayFirst(c){if(DF[c.id]!==undefined)return DF[c.id];let r=true;for(const m of c.msgs){const p=m.d.split(/[\/.\-]/).map(Number);if(p[0]>12){r=true;break}if(p[1]>12){r=false;break}}return DF[c.id]=r}
function ts(c,m){if(m.ts)return m.ts;const p=m.d.split(/[\/.\-]/).map(Number),df=dayFirst(c);const t=m.t.match(/(\d{1,2})[:.](\d{2})(?::(\d{2}))?\s?([AaPp])?/)||[];let h=+t[1]||0;if(/p/i.test(t[4]||"")&&h<12)h+=12;if(/a/i.test(t[4]||"")&&h===12)h=0;const y=p[2]<100?2000+p[2]:p[2];return new Date(y,(df?p[1]:p[0])-1,df?p[0]:p[1],h,+t[2]||0,+t[3]||0).getTime()||0}
function buildView(){const ids=cur.kind==="combo"?[...cur.src,cur.id]:[cur.id],v=[];meSet=new Set();ids.forEach(id=>{const c=chats.find(x=>x.id===id);if(!c)return;if(c.me)meSet.add(c.me);c.msgs.forEach((m,i)=>v.push({m,c:id,i,t:ts(c,m)}))});if(ids.length>1)v.sort((a,b)=>a.t-b.t||a.i-b.i);return v}
/* import / backup */
async function importFiles(files){
 let text="",name="",media={};
 for(const f of files){const n=f.name;
  if(/\.zip$/i.test(n)){const z=await JSZip.loadAsync(f);if(z.file("chats.json")){await restore(z);return}name=name||n;
   for(const k of Object.keys(z.files)){const e=z.files[k];if(e.dir)continue;const base=k.split("/").pop();
    if(/\.txt$/i.test(base)&&!text){text=await e.async("string");name=base}else if(!/\.txt$/i.test(base))media[base]=await e.async("blob")}}
  else if(/\.txt$/i.test(n)){text=await f.text();name=n}else media[n]=f}
 if(!text){ask("Please choose the exported chat .txt file or the .zip.");return}
 const msgs=parse(text);if(!msgs.length){ask("Couldn’t read messages from that file.");return}
 const senders=[...new Set(msgs.map(m=>m.s).filter(Boolean))],id=Date.now().toString(36);
 const title=name.replace(/\.(txt|zip)$/i,"").replace(/^WhatsApp Chat( with| -)?\s*/i,"")||"Chat";
 const chat={id,title,msgs,senders,me:senders.length==2?"":senders[0]||"",added:Date.now()};
 await save(chat);for(const k of Object.keys(media))await op("media","readwrite",s=>s.put(media[k],id+"/"+k));
 await load();askMe(chat)}
async function restore(z){const cs=JSON.parse(await z.file("chats.json").async("string"));for(const c of cs)await save(c);
 for(const k of Object.keys(z.files)){const e=z.files[k];if(e.dir||!k.startsWith("media/"))continue;const b=await e.async("blob");await op("media","readwrite",s=>s.put(b,k.slice(6)))}
 await load();showList()}
async function saveFile(name,blob){try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}catch(e){}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
async function exportAll(){try{const z=new JSZip();z.file("chats.json",JSON.stringify(await op("chats","readonly",s=>s.getAll())));const ks=await op("media","readonly",s=>s.getAllKeys());for(const k of ks)z.file("media/"+k,await op("media","readonly",s=>s.get(k)));await saveFile("ruhi-backup.zip",await z.generateAsync({type:"blob",compression:"STORE"}))}catch(e){ask("Backup failed: "+e.message)}}
/* helpers */
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(s){s=esc(s);s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" data-u="$1">$1</a>');return s.replace(/\*([^*\n]+)\*/g,"<b>$1</b>").replace(/(^|\s)_([^_\n]+)_/g,"$1<i>$2</i>").replace(/~([^~\n]+)~/g,"<s>$1</s>")}
function color(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},55%,45%)`}
const av=(c,z)=>`<div class="av" style="width:${z}px;height:${z}px;font-size:${z*.42}px;${c.photo?`background-image:url(${c.photo});background-size:cover`:""}">${c.photo?"":esc((c.title[0]||"?").toUpperCase())}</div>`;
const ext=f=>(f.split(".").pop()||"").toLowerCase();
const isMedia=f=>/^(jpe?g|png|gif|webp|mp4|mov|3gp|webm)$/.test(ext(f)),isAud=f=>/^(opus|mp3|m4a|ogg|aac|wav)$/.test(ext(f));
function hydrate(){document.querySelectorAll("[data-m]").forEach(async el=>{const k=el.dataset.m;try{await mUrl(k);if(urls[k])el.src=urls[k]+(el.dataset.t==="video"?"#t=0.1":"");else el.outerHTML='<span class="file">📎 '+esc(k.split("/").pop())+" (not imported)</span>"}catch(e){}})}
const mvHtml=(k,tag)=>`<span class="mv ${tag}" data-v="${esc(k)}"><${tag} data-m="${esc(k)}" data-t="${tag}" ${tag==="img"?'alt=""':'playsinline preload="metadata" muted'}></${tag}></span>`;
